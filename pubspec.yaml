name: pubviz
version: 6.3.0-wip
description: >-
  A tool to visualize package dependencies and version constraints in your Dart
  project.
homepage: https://github.com/kevmoo/pubviz

environment:
  sdk: ^3.12.0

dependencies:
  args: ^2.7.0
  build_cli_annotations: ^2.1.1
  collection: ^1.19.1
  gviz: ^0.4.2
  io: ^1.0.5
  json_annotation: ^4.12.0
  meta: ^1.19.0
  path: ^1.9.1
  pub_semver: ^2.2.0
  pubspec_parse: ^1.5.0
  shelf: ^1.4.2
  stack_trace: ^1.12.1
  string_scanner: ^1.4.1
  web: ^1.1.1

dev_dependencies:
  build_cli: ^2.2.13
  build_runner: ^2.16.0
  build_verify: ^3.1.1
  build_version: ^2.1.3
  build_web_compilers: ^4.8.0
  checks: ^0.3.1
  crypto: ^3.0.7
  dart_flutter_team_lints: ^3.5.2
  http: ^1.6.0
  json_serializable: ^6.14.1
  test: ^1.31.2
  test_descriptor: ^2.0.2
  test_process: ^2.1.1
  yaml: ^3.1.3


executables:
  pubviz: null
